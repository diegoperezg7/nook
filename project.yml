name: Nook
options:
  bundleIdPrefix: com.diegoperez
  # Sin esto Xcode pide "actualizar a los ajustes recomendados" en cada apertura:
  # el .xcodeproj es generado y el cambio manual se pierde al regenerar.
  xcodeVersion: "27.2"
  deploymentTarget:
    macOS: "14.2"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: H473PHH58Y
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
    scheme:
      testTargets:
        - NookTests
    # Sandbox desde el primer dia: no hace falta ningun permiso que lo impida
    # (sin Accesibilidad ni Grabacion de pantalla) y deja abierta la Mac App Store.
    # Servicio de Finder: clic derecho > Servicios > Añadir a Nook.
    info:
      path: Nook/Info.plist
      properties:
        # Volumen por app: captar el sonido de una app para cambiar su volumen.
        NSAudioCaptureUsageDescription: "Nook capta el sonido de la app que elijas solo para subirle o bajarle el volumen. No graba ni guarda nada."
        NSServices:
          - NSMenuItem:
              default: Añadir a Nook
            NSMessage: addToNook
            NSPortName: Nook
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
    entitlements:
      path: Nook/Nook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Archivos elegidos en el panel de abrir (boton "+") y la carpeta de
        # capturas, que se recuerda con un marcador y se puede borrar (a la Papelera).
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Aviso de descargas: solo mira que archivos aparecen en Descargas.
        com.apple.security.files.downloads.read-only: true
        # Calendario: eventos del Mac y alta rapida (EventKit).
        com.apple.security.personal-information.calendars: true
        # Bandeja de entrada: remitente, asunto y hora de los no leidos de Mail o
        # de Outlook (AppleScript, solo a esas dos apps).
        # Dictado (microfono) y tiempo (Open-Meteo).
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.mail
          - com.microsoft.Outlook
        # Solo lectura de los datos de los nombres anteriores de la app (Perch,
        # Notchbin): se importan una vez al arrancar para no perder nada.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Containers/com.diegoperez.perch/Data/Library/Application Support/Perch/
          - /Library/Containers/com.diegoperez.notchbin/Data/Library/Application Support/Notchbin/
          # Pestaña de agentes de IA: solo metadatos de sesion. Ni transcripts
          # (~/.claude/projects) ni credenciales (~/.codex/auth.json, Llavero).
          - /.claude/sessions/
          - /.claude/nook-usage.json
          - /.codex/state_5.sqlite
          - /.codex/state_5.sqlite-wal
          - /.codex/state_5.sqlite-shm
          - /.codex/thread_history_1.sqlite
          - /.codex/thread_history_1.sqlite-wal
          - /.codex/thread_history_1.sqlite-shm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.nook
        PRODUCT_NAME: Nook
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "13"
        GENERATE_INFOPLIST_FILE: YES
        # Sin icono en el Dock ni menu: la app vive en el notch.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Nook muestra tus eventos en el notch y te deja añadir uno escribiendo, por ejemplo «Café con Ana mañana a las 10»."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Nook usa el micrófono solo mientras dictas, para pasar tu voz a texto."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Nook convierte lo que dictas en texto y lo copia al portapapeles."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Nook muestra en el notch quién te ha escrito (remitente, asunto y hora de los correos sin leer). No cambia nada en tu correo."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Nook muestra tus eventos en el notch y te deja añadir uno escribiendo."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Diego Pérez García"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # La build de desarrollo tiene su propio contenedor: probarla nunca toca
      # la bandeja ni el historial de la app instalada.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.nook.debug

  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.nook.tests
