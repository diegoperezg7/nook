name: Perch
options:
  bundleIdPrefix: com.diegoperez
  # Sin esto Xcode pide "actualizar a los ajustes recomendados" en cada apertura:
  # el .xcodeproj es generado y el cambio manual se pierde al regenerar.
  xcodeVersion: "27.2"
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: H473PHH58Y
targets:
  Perch:
    type: application
    platform: macOS
    sources:
      - path: Perch
    scheme:
      testTargets:
        - PerchTests
    # Sandbox desde el primer dia: no hace falta ningun permiso que lo impida
    # (sin Accesibilidad ni Grabacion de pantalla) y deja abierta la Mac App Store.
    entitlements:
      path: Perch/Perch.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.perch
        PRODUCT_NAME: Perch
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        # Sin icono en el Dock ni menu: la app vive en el notch.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Perch
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Diego Pérez García"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PerchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PerchTests
    dependencies:
      - target: Perch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.perch.tests
