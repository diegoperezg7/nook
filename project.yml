name: Nook
options:
  bundleIdPrefix: com.diegoperez
  # Sin esto Xcode pide "actualizar a los ajustes recomendados" en cada apertura:
  # el .xcodeproj es generado y el cambio manual se pierde al regenerar.
  xcodeVersion: "27.2"
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: H473PHH58Y
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
    scheme:
      testTargets:
        - NookTests
    # Sandbox desde el primer dia: no hace falta ningun permiso que lo impida
    # (sin Accesibilidad ni Grabacion de pantalla) y deja abierta la Mac App Store.
    # Servicio de Finder: clic derecho > Servicios > Añadir a Nook.
    info:
      path: Nook/Info.plist
      properties:
        NSServices:
          - NSMenuItem:
              default: Añadir a Nook
            NSMessage: addToNook
            NSPortName: Nook
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
    entitlements:
      path: Nook/Nook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Archivos elegidos en el panel de abrir (boton "+") y la carpeta de
        # capturas, que se recuerda con un marcador y se puede borrar (a la Papelera).
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Solo lectura de los datos de los nombres anteriores de la app (Perch,
        # Notchbin): se importan una vez al arrancar para no perder nada.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Containers/com.diegoperez.perch/Data/Library/Application Support/Perch/
          - /Library/Containers/com.diegoperez.notchbin/Data/Library/Application Support/Notchbin/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.nook
        PRODUCT_NAME: Nook
        MARKETING_VERSION: "0.4.1"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: YES
        # Sin icono en el Dock ni menu: la app vive en el notch.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nook
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Diego Pérez García"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # La build de desarrollo tiene su propio contenedor: probarla nunca toca
      # la bandeja ni el historial de la app instalada.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.nook.debug

  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.nook.tests
