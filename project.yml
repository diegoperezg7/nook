name: Nook
options:
  bundleIdPrefix: com.diegoperez
  # Sin esto Xcode pide "actualizar a los ajustes recomendados" en cada apertura:
  # el .xcodeproj es generado y el cambio manual se pierde al regenerar.
  xcodeVersion: "27.2"
  deploymentTarget:
    macOS: "14.2"
  developmentLanguage: es
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: H473PHH58Y
packages:
  # Actualizaciones automaticas (appcast firmado con EdDSA en cada release).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - path: Nook
    dependencies:
      - package: Sparkle
    scheme:
      testTargets:
        - NookTests
    # Sin sandbox desde la 0.12 (ver entitlements); los datos viven en el App Group.
    # (sin Accesibilidad ni Grabacion de pantalla) y deja abierta la Mac App Store.
    # Servicio de Finder: clic derecho > Servicios > Añadir a Visor.
    info:
      path: Nook/Info.plist
      properties:
        NookAppGroup: $(NOOK_APP_GROUP)
        # Actualizaciones (Sparkle): el appcast va como archivo de cada release de GitHub
        # y cada DMG lleva firma EdDSA (clave privada en el Llavero, cuenta "nook").
        SUFeedURL: https://github.com/diegoperezg7/visor/releases/latest/download/appcast.xml
        SUPublicEDKey: tnW3xBsF18kFnVEQl6EUZHRgEoatYiXYfNmvIVmMMS0=  # gitleaks:allow (clave publica de Sparkle, no es secreta)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Bateria de AirPods y accesorios (system_profiler lee Bluetooth).
        NSBluetoothAlwaysUsageDescription: "Visor muestra en el notch la batería de tus AirPods, teclado y ratón."
        NSFocusStatusUsageDescription: "Visor avisa en el notch cuando activas o quitas No molestar o un modo de Concentración."
        NSServices:
          - NSMenuItem:
              default: Añadir a Visor
            NSMessage: addToNook
            NSPortName: Visor
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
    entitlements:
      path: Nook/Nook.entitlements
      properties:
        # Sin sandbox desde la 0.12: pegar en otras apps, notificaciones, ventanas y
        # texto seleccionado necesitan Accesibilidad o leer fuera del contenedor.
        # Los datos siguen en el App Group (la 0.11 los copio ahi).
        com.apple.security.application-groups:
          - $(NOOK_APP_GROUP)
        # Estado de Concentracion (INFocusStatusCenter) para su aviso.
        com.apple.developer.usernotifications.communication: true
        # Con Hardened Runtime estos permisos se siguen declarando.
        # Calendario: eventos del Mac y alta rapida (EventKit).
        com.apple.security.personal-information.calendars: true
        # Dictado (microfono).
        com.apple.security.device.audio-input: true
        # Espejo: verte en la camara antes de una llamada.
        com.apple.security.device.camera: true
        # Bandeja de entrada (Mail/Outlook) y controles de reunion.
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.visor
        NOOK_APP_GROUP: H473PHH58Y.com.diegoperez.nook
        # El App Group y el modulo conservan "nook": ahi estan los datos de la app y
        # los tests importan el modulo Nook.
        PRODUCT_NAME: Visor
        PRODUCT_MODULE_NAME: Nook
        MARKETING_VERSION: "0.22.3"
        CURRENT_PROJECT_VERSION: "30"
        GENERATE_INFOPLIST_FILE: YES
        # Sin icono en el Dock ni menu: la app vive en el notch.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Visor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Visor muestra tus eventos en el notch y te deja añadir uno escribiendo, por ejemplo «Café con Ana mañana a las 10»."
        INFOPLIST_KEY_NSCameraUsageDescription: "Visor enseña tu cámara en el notch solo mientras abres el espejo, para que te veas antes de una llamada. No graba nada."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Visor usa el micrófono solo mientras dictas, para pasar tu voz a texto."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Visor convierte lo que dictas en texto y lo copia al portapapeles."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Visor muestra en el notch quién te ha escrito (remitente, asunto y hora de los correos sin leer). No cambia nada en tu correo."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "Visor muestra tus recordatorios pendientes junto al calendario y te deja marcarlos como hechos o crear uno escribiendo."
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Visor muestra tus eventos en el notch y te deja añadir uno escribiendo."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Diego Pérez García"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # La build de desarrollo tiene su propio contenedor: probarla nunca toca
      # la bandeja ni el historial de la app instalada.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.visor.debug
          NOOK_APP_GROUP: H473PHH58Y.com.diegoperez.nook.debug

  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.diegoperez.visor.tests
        # El producto se llama Visor, no como el target.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Visor.app/Contents/MacOS/Visor
        BUNDLE_LOADER: $(TEST_HOST)
